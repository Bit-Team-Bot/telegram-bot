# Beispiel-Integration für deine bestehende docker-compose.yml
#
# Füge den webui Service zu deiner bestehenden docker-compose.yml hinzu:

version: '3.8'

services:
  # ... deine bestehenden Services (api, bot, userbot, redis, postgres)

  webui:
    build: ./webui
    container_name: telegram-bot-webui
    ports:
      - "8080:80"
    environment:
      # Diese werden beim Build in die statischen Dateien eingebaut
      - VITE_API_URL=http://api:8000
      - VITE_USERBOT_URL=http://userbot:9000
    depends_on:
      - api
      - userbot
    networks:
      - telegram-bot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  telegram-bot-network:
    driver: bridge

# Alternative: Wenn du externe URLs verwenden willst
